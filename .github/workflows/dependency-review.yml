name: Dependency Review

on:
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions — read-only on contents and PRs for commenting
permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Flags new dependencies that introduce vulnerabilities or forbidden licenses.
      # Severity threshold: high and critical CVEs block the PR.
      # License block-list covers copyleft licenses incompatible with a private
      # commercial frontend (GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0).
      # To request an exception, open a new issue with the label
      # "dependency-exception" and get sign-off from a maintainer before merging.
      - name: Run dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: >-
            GPL-2.0,
            GPL-3.0,
            AGPL-3.0,
            LGPL-2.1,
            LGPL-3.0
          # Allow existing exceptions tracked in the repo — add PURL strings here
          # when a license exception is formally approved.
          allow-dependencies-licenses: ""
          comment-summary-in-pr: always
