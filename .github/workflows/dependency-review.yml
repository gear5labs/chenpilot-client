name: Dependency Review

on:
  pull_request:
    branches: [ "*" ]

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Skip dependency review on private repositories without advanced security
        run: echo "Dependency review skipped"
